name: History hygiene

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  history:
    name: Check reachable history
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check full commit history
        shell: bash
        run: sh .githooks/check-history

      - name: Run guard self-test
        shell: bash
        run: sh .githooks/test-history
