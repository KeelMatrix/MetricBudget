name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
    env:
      KEELMATRIX_NO_TELEMETRY: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.401

      - name: Assert CI telemetry opt-out
        shell: pwsh
        run: |
          if ($env:KEELMATRIX_NO_TELEMETRY -ne "1") {
              throw "CI must run with KEELMATRIX_NO_TELEMETRY=1."
          }

      - name: Restore solution
        run: dotnet restore KeelMatrix.MetricBudget.sln --configfile NuGet.config --force-evaluate --no-cache

      - name: Build solution (Release)
        run: dotnet build KeelMatrix.MetricBudget.sln --configuration Release --no-restore

      - name: Test net8.0
        run: dotnet test tests/KeelMatrix.MetricBudget.Tests/KeelMatrix.MetricBudget.Tests.csproj --configuration Release --framework net8.0 --no-build

      # The net472 host exercises the netstandard2.0 asset and does not exist on Linux.
      - name: Test net472 on Windows
        if: matrix.os == 'windows-latest'
        run: dotnet test tests/KeelMatrix.MetricBudget.Tests/KeelMatrix.MetricBudget.Tests.csproj --configuration Release --framework net472 --no-build

      - name: Verify formatting
        run: dotnet format KeelMatrix.MetricBudget.sln --verify-no-changes

      - name: Pack and verify package
        shell: pwsh
        run: pwsh -NoProfile -File scripts/verify-package.ps1
