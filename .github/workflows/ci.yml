name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
    env:
      KEELMATRIX_NO_TELEMETRY: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify hidden child PowerShell launch guard
        shell: pwsh
        run: ./build/Test-NestedPwshLaunch.ps1 -SelfTest

      - name: Scan repository child PowerShell launches
        shell: pwsh
        run: ./build/Test-NestedPwshLaunch.ps1

      - name: Validate workflow safety
        shell: pwsh
        run: pwsh -NoProfile -File scripts/validate-workflows.ps1

      - name: Test release source provenance
        shell: pwsh
        run: pwsh -NoProfile -File scripts/tests/validate-release-provenance.tests.ps1

      - name: Test release contract
        shell: pwsh
        run: pwsh -NoProfile -File scripts/tests/validate-release.tests.ps1

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Verify resolved .NET SDK
        shell: pwsh
        run: |
          $sdk = Get-Content -Raw global.json | ConvertFrom-Json
          $expected = ([string]$sdk.sdk.version).Trim()
          $resolved = (& dotnet --version).Trim()
          Write-Output "Resolved .NET SDK: $resolved"
          Write-Output "global.json SDK pin: $expected"
          $expectedVersion = [version]::Parse($expected)
          $resolvedVersion = [version]::Parse($resolved)
          $isCompatible = switch ([string]$sdk.sdk.rollForward) {
              "disable" { $resolvedVersion -eq $expectedVersion; break }
              "latestPatch" {
                  $sameFeatureBand = [math]::Floor($resolvedVersion.Build / 100) -eq [math]::Floor($expectedVersion.Build / 100)
                  ($resolvedVersion.Major -eq $expectedVersion.Major) -and
                      ($resolvedVersion.Minor -eq $expectedVersion.Minor) -and
                      $sameFeatureBand -and
                      ($resolvedVersion -ge $expectedVersion)
                  break
              }
              default { throw "Unsupported global.json SDK rollForward policy '$($sdk.sdk.rollForward)'." }
          }
          if (-not $isCompatible) {
              throw "Resolved .NET SDK '$resolved' is outside the global.json version '$expected' and rollForward policy '$($sdk.sdk.rollForward)'."
          }
          Write-Output "SDK_VERSION_CHECK=PASS"

      - name: Test website package metadata contract
        shell: pwsh
        run: pwsh -NoProfile -File scripts/tests/validate-website-metadata.tests.ps1

      - name: Assert CI telemetry opt-out
        shell: pwsh
        run: |
          if ($env:KEELMATRIX_NO_TELEMETRY -ne "1") {
              throw "CI must run with KEELMATRIX_NO_TELEMETRY=1."
          }

      - name: Restore solution
        run: dotnet restore KeelMatrix.MetricBudget.sln --configfile NuGet.config --force-evaluate --no-cache

      - name: Build solution (Release)
        run: dotnet build KeelMatrix.MetricBudget.sln --configuration Release --no-restore

      - name: Test package vulnerability gate
        shell: pwsh
        run: pwsh -NoProfile -File scripts/tests/verify-package.tests.ps1

      - name: Test net8.0
        run: dotnet test tests/KeelMatrix.MetricBudget.Tests/KeelMatrix.MetricBudget.Tests.csproj --configuration Release --framework net8.0 --no-build --no-restore

      # The net472 host exercises the netstandard2.0 asset and does not exist on Linux.
      - name: Test net472 on Windows
        if: matrix.os == 'windows-latest'
        run: dotnet test tests/KeelMatrix.MetricBudget.Tests/KeelMatrix.MetricBudget.Tests.csproj --configuration Release --framework net472 --no-build --no-restore

      - name: Verify formatting
        run: dotnet format KeelMatrix.MetricBudget.sln --verify-no-changes --no-restore

      - name: Pack and verify package
        shell: pwsh
        run: pwsh -NoProfile -File scripts/verify-package.ps1
